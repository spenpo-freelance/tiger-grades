name: WordPress Build & Automation

on:
  push:
    branches: [ "main", "staging", "release" ]
  pull_request:
    branches: [ "main", "staging", "release" ]
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  COMPOSER_NO_INTERACTION: 1

jobs:
  build:
    name: Build WordPress
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: mbstring, xml, curl, zip, gd, mysql, mysqli
        coverage: none

    - name: Install Composer
      uses: php-actions/composer@v6
      with:
        php_version: ${{ env.PHP_VERSION }}

    - name: Validate composer.json
      run: composer validate --strict

    - name: Create Composer cache directory
      run: mkdir -p ~/.composer/cache

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache
        key: ${{ runner.os }}-php-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-composer-

    - name: Make scripts executable
      run: |
        chmod +x build.sh

    - name: Ensure workspace permissions
      run: |
        # Ensure the workspace is writable by the current user
        # This fixes permission issues that can occur with cached files
        sudo chown -R $USER:$USER . || true
        chmod -R u+w . || true

    - name: Run WordPress build
      run: ./build.sh
      continue-on-error: false
      env:
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

    - name: Verify build output
      run: |
        if [ ! -d "wordpress" ]; then
          echo "❌ WordPress directory not created"
          exit 1
        fi
        if [ ! -f "wordpress/index.php" ]; then
          echo "❌ WordPress index.php not found"
          exit 1
        fi
        echo "✅ WordPress build verified"

    - name: Set deployment path
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "DEPLOY_PATH=${{ secrets.TIGER_GRADES_PATH }}" >> $GITHUB_ENV
        else
          echo "DEPLOY_PATH=${{ secrets.TIGER_GRADES_PATH }}/${{ github.ref_name }}" >> $GITHUB_ENV
        fi

    - name: Show deployment size
      run: |
        echo "📦 Deployment size analysis:"
        du -sh wordpress/ || true
        echo ""
        echo "Top 10 largest directories:"
        du -h wordpress/* 2>/dev/null | sort -rh | head -10 || true

    - name: Create rsync exclude file
      run: |
        cat > .rsync-exclude << 'EOF'
        # Cache directories
        wp-content/cache/
        wp-content/upgrade/
        
        # Logs
        *.log
        wp-content/debug.log
        
        # OS files
        .DS_Store
        ._*
        Thumbs.db
        ehthumbs.db
        
        # Temporary files
        *.tmp
        *.temp
        *~
        
        # IDE files
        .vscode/
        .idea/
        *.swp
        *.swo
        
        # Environment files
        wp-config.php
        .env*
        
        # Git files
        .git/
        .gitignore
        .gitattributes
        
        # Node modules (if any)
        node_modules/
        **/node_modules/
        
        # Build artifacts
        *.map
        EOF
        echo "✅ Created rsync exclude file"

    - name: Clean up broken symlinks in build
      run: |
        echo "🔍 Checking for broken symlinks in wordpress/..."
        # Find and remove broken symlinks (symlinks that don't point to existing files)
        find wordpress/ -type l 2>/dev/null | while read -r link; do
          if [ ! -e "$link" ]; then
            echo "   Removing broken symlink: $link"
            rm -f "$link"
          fi
        done
        echo "✅ Cleaned up broken symlinks"

    - name: Clean up remote symlinks and conflicts (pre-deploy)
      uses: appleboy/ssh-action@v0.1.8
      continue-on-error: true
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        key: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
        port: ${{ secrets.HOSTINGER_PORT }}
        script: |
          cd ${{ env.DEPLOY_PATH }} || exit 0
          # Remove any broken symlinks or symlinks that might conflict
          find wp-content/plugins -type l -delete 2>/dev/null || true
          find wp-content/themes -type l -delete 2>/dev/null || true
          echo "✅ Cleaned up remote symlinks"

    - name: Deploy via Rsync (with retry)
      id: rsync-deploy
      continue-on-error: true
      uses: burnett01/rsync-deployments@5.2.1
      with:
        switches: -avzrL --progress --partial --partial-dir=.rsync-partial --force --copy-unsafe-links --exclude-from=.rsync-exclude
        path: wordpress/
        remote_path: ${{ env.DEPLOY_PATH }}
        remote_host: ${{ secrets.HOSTINGER_HOST }}
        remote_user: ${{ secrets.HOSTINGER_USERNAME }}
        remote_key: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
        remote_port: ${{ secrets.HOSTINGER_PORT }}

    - name: Retry Rsync if failed
      if: steps.rsync-deploy.outcome == 'failure'
      continue-on-error: true
      uses: burnett01/rsync-deployments@5.2.1
      with:
        switches: -avzrL --progress --partial --partial-dir=.rsync-partial --force --copy-unsafe-links --exclude-from=.rsync-exclude
        path: wordpress/
        remote_path: ${{ env.DEPLOY_PATH }}
        remote_host: ${{ secrets.HOSTINGER_HOST }}
        remote_user: ${{ secrets.HOSTINGER_USERNAME }}
        remote_key: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
        remote_port: ${{ secrets.HOSTINGER_PORT }}

    - name: Final Rsync attempt
      if: steps.rsync-deploy.outcome == 'failure'
      uses: burnett01/rsync-deployments@5.2.1
      with:
        switches: -avzrL --progress --partial --partial-dir=.rsync-partial --force --copy-unsafe-links --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r --exclude-from=.rsync-exclude
        path: wordpress/
        remote_path: ${{ env.DEPLOY_PATH }}
        remote_host: ${{ secrets.HOSTINGER_HOST }}
        remote_user: ${{ secrets.HOSTINGER_USERNAME }}
        remote_key: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
        remote_port: ${{ secrets.HOSTINGER_PORT }}

    - name: Sync new images with WordPress Database
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        key: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
        port: ${{ secrets.HOSTINGER_PORT }}
        script: |
          cd ${{ env.DEPLOY_PATH }}
          wp eval-file wordpress-image-sync.php

    - name: Run migrations on target environment
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        key: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
        port: ${{ secrets.HOSTINGER_PORT }}
        script: |
          cd ${{ env.DEPLOY_PATH }}
          chmod +x migrations.sh
          ./migrations.sh ${{ env.DEPLOY_PATH }}

    - name: Build summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ WordPress build completed successfully" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- WordPress installation: \`wordpress/\`" >> $GITHUB_STEP_SUMMARY
        if [ -d "wordpress/wp-content/themes" ]; then
          echo "- Themes: $(ls -1 wordpress/wp-content/themes | wc -l) installed" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -d "wordpress/wp-content/plugins" ]; then
          echo "- Plugins: $(ls -1 wordpress/wp-content/plugins | wc -l) installed" >> $GITHUB_STEP_SUMMARY
        fi
